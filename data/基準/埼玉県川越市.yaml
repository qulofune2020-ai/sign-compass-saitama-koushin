    観点: 板面替え
    要約: "軽微な変更は、色彩・意匠・形状を変えない修繕・補強・塗替えと、興行等の内容の定期的な変更。店舗の板面替えは軽微に当たらない書き方。"
    引用: "屋外広告物又は掲出物件の色彩、意匠、又は形状に変更を加えない程度に修繕し、補強し、又は塗り替えること。"
